<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Clínica Vida Plena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Clínica Vida Plena</h1>
        <nav>
            <a href="index.html">Início</a><br>
            <a href="agendamento.html">Agendamento</a>
        </nav>
    </header>

    <main>
        <h2>Agende sua Consulta</h2>
        <p>Preencha os dados abaixo para solicitar o agendamento de sua consulta.</p>

        <form id="form-agendamento">
            <label for="nome">Nome Completo:</label><br>
            <input type="text" id="nome" name="nome" required><br><br>

            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="telefone">Telefone / WhatsApp:</label><br>
            <input type="tel" 
                   name="telefone" 
                   id="telefone" 
                   required
                   inputmode="numeric"
                   maxlength="15"
                   pattern="(?:\(?[1-9]{2}\)?\s?)?(?:9\d{4}|\d{4})-?\d{4}"
                   title="Digite com DDD. Ex: (17) 98765-4321 ou 17987654321">
            <br><br>

            <label for="data">Data da Consulta:</label><br>
            <input type="date" id="data" name="data" required><br><br>

            <label for="especialidade">Especialidade:</label><br>
            <select id="especialidade" name="especialidade" required>
                <option value="">Selecione uma opção</option>
                <option value="clinico">Clínico Geral</option>
                <option value="cardiologia">Cardiologia</option>
                <option value="pediatria">Pediatria</option>
                <option value="dermatologia">Dermatologia</option>
            </select><br><br>

            <button type="submit">Enviar Agendamento</button>
        </form>
    </main>

    <footer>
        <p>Clínica Vida Plena - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
